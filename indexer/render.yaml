# Render.com blueprint for the SatoshiYield indexer.
# After signing into Render, select "New > Blueprint" and point it at this repo.
services:
  - type: web
    name: satoshi-yield-indexer
    # Always-on paid tier (NOT free): the free tier sleeps after ~15 min idle,
    # which would stop the 30-min oracle push and let the on-chain APY go stale
    # (blocking deposits). "starter" stays up 24/7. Run only ONE instance — the
    # oracle pusher is a single writer (multiple instances would clash on nonces).
    plan: starter
    numInstances: 1
    runtime: node
    rootDir: indexer
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STACKS_NETWORK
        value: mainnet
      - key: STACKS_API_URL
        value: https://api.hiro.so
      - key: CACHE_TTL_SECONDS
        value: "300"
      # All of the values below MUST be set in the Render dashboard before the
      # service can boot. chain.ts and index.ts both throw at startup if they
      # are missing or wrong.
      - key: DEPLOYER_ADDRESS         # single-key deployer SP-principal (mainnet)
        sync: false
      - key: CORS_ALLOWED_ORIGINS     # comma-separated, e.g. https://satoshiyields.com
        sync: false
      - key: ORACLE_PRIVATE_KEY       # 64-hex, fresh oracle wallet 1
        sync: false
      - key: ORACLE_PRIVATE_KEY_2     # 64-hex, fresh oracle wallet 2 (REQUIRED for 2-of-3 consensus)
        sync: false
