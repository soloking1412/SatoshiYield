---
# Testnet v5 deploy plan.
#
# CRITICAL: deploy this bundle under a FRESH deployer wallet. The previous
# deployer key (ST1JXS4BTWDNNEX28QS8ABHQSCAD4BQMAN11TP6B1) is compromised -
# it was committed to the public repo. Procedure:
#   1. Generate a new wallet: `clarinet wallet new` (or a fresh 24-word mnemonic)
#   2. Put the new mnemonic in settings/Testnet.toml -> [accounts.deployer]
#   3. Fund the new address: https://explorer.hiro.so/sandbox/faucet?chain=testnet
#   4. Regenerate this plan with the correct sender:
#        clarinet deployments generate --testnet
#      (or replace every ST1JXS4BTWDNNEX28QS8ABHQSCAD4BQMAN11TP6B1 below by hand)
#   5. clarinet deployments apply --testnet -p deployments/v5.testnet-plan.yaml
#   6. node scripts/init-v5.js  (registers sBTC token, adapters, oracles)
#
# Trait/contract references are deployer-relative, so the fresh deployer must
# publish the entire stack - it cannot reuse the old deployer's contracts.
id: 3
name: Testnet v5 - SIP-010 token trait + rebalance staleness guard
network: testnet
stacks-node: "https://api.testnet.hiro.so"
bitcoin-node: "http://blockstack:blockstacksystem@bitcoind.testnet.stacks.co:18332"
plan:
  batches:
    - id: 0
      transactions:
        - contract-publish:
            contract-name: sip-010-trait
            expected-sender: ST1JXS4BTWDNNEX28QS8ABHQSCAD4BQMAN11TP6B1
            cost: 100000
            path: contracts/traits/sip-010-trait.clar
            anchor-block-only: true
            clarity-version: 3
