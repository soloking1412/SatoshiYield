# Testnet v6 — deploy yield-accrual adapters (v5) alongside existing vault-v5.
#
# These adapters are additive — vault-v5 stays unchanged, existing user
# positions on v4 adapters are not affected.
#
# Deploy procedure:
#   1. clarinet deployments apply --testnet -p deployments/v6.testnet-plan.yaml
#   2. node scripts/init-v6.mjs
#      (sets vault, oracles, approves adapters, funds yield reserves)
#
id: 4
name: Testnet v6 - yield-accrual adapters (v5)
network: testnet
stacks-node: "https://api.testnet.hiro.so"
