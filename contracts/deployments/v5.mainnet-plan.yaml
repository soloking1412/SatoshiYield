---
# Mainnet deployment plan for SatoshiYields v5.
#
# IMPORTANT: this file is a RECORD, not an execution script. Mainnet contracts
# are published via the Asigna 2-of-3 multi-sig UI at https://asigna.io, not by
# `clarinet deployments apply --mainnet`. Asigna proposes each
# contract-publish; two signers approve; Asigna broadcasts.
#
# Deploy order:
#   Batch 0 (traits — must confirm first):
#     1. sip-010-trait
#     2. yield-source-v2
#   Batch 1 (vault — uses both traits above):
#     3. vault-v5
#   Batch 2 (adapters — use yield-source-v2 trait + vault-v5 principal):
#     4. bitflow-adapter-v4
#     5. alex-adapter-v4
#     6. zest-adapter-v4
#     7. velar-adapter-v4
#
# Post-publish initialization (also via Asigna contract-call):
#   - vault-v5.set-sbtc-token('SM3KNVZS30WM7F89SXKVVFY4SN9RMPZZ9FX929CCA.sbtc-token)
#   - vault-v5.approve-adapter(each adapter principal) ×4
#   - <adapter>.set-vault(vault-v5 principal) ×4
#   - <adapter>.set-oracle-at(u0, <oracle-1 SP-address>) ×4
#   - <adapter>.set-oracle-at(u1, <oracle-2 SP-address>) ×4
#
# Once Asigna confirms the deploy, fill in MAINNET-DEPLOY.md with txids +
# the multi-sig deployer principal, and replace REPLACE_WITH_ASIGNA_MULTISIG
# below with the actual SP-address.
id: 1
name: Mainnet v5 — Asigna 2-of-3 multi-sig deployer
network: mainnet
stacks-node: "https://api.hiro.so"
bitcoin-node: "https://bitcoin.hiro.so"
plan:
  batches:
    - id: 0
      transactions:
        - contract-publish:
            contract-name: sip-010-trait
            expected-sender: REPLACE_WITH_ASIGNA_MULTISIG
            cost: 100000
            path: contracts/traits/sip-010-trait.clar
            anchor-block-only: true
            clarity-version: 3
        - contract-publish:
            contract-name: yield-source-v2
            expected-sender: REPLACE_WITH_ASIGNA_MULTISIG
            cost: 100000
            path: contracts/traits/yield-source-v2.clar
            anchor-block-only: true
            clarity-version: 3
      epoch: "3.2"
    - id: 1
      transactions:
        - contract-publish:
            contract-name: vault-v5
            expected-sender: REPLACE_WITH_ASIGNA_MULTISIG
            cost: 300000
            path: contracts/vault-v5.clar
            anchor-block-only: true
            clarity-version: 3
      epoch: "3.2"
    - id: 2
      transactions:
        - contract-publish:
            contract-name: bitflow-adapter-v4
            expected-sender: REPLACE_WITH_ASIGNA_MULTISIG
            cost: 200000
            path: contracts/adapters/bitflow-adapter-v4.clar
            anchor-block-only: true
            clarity-version: 3
        - contract-publish:
            contract-name: alex-adapter-v4
            expected-sender: REPLACE_WITH_ASIGNA_MULTISIG
            cost: 200000
            path: contracts/adapters/alex-adapter-v4.clar
            anchor-block-only: true
            clarity-version: 3
        - contract-publish:
            contract-name: zest-adapter-v4
            expected-sender: REPLACE_WITH_ASIGNA_MULTISIG
            cost: 200000
            path: contracts/adapters/zest-adapter-v4.clar
            anchor-block-only: true
            clarity-version: 3
        - contract-publish:
            contract-name: velar-adapter-v4
            expected-sender: REPLACE_WITH_ASIGNA_MULTISIG
            cost: 200000
            path: contracts/adapters/velar-adapter-v4.clar
            anchor-block-only: true
            clarity-version: 3
      epoch: "3.2"
