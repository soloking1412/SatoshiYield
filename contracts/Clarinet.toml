[project]
name = "satoshi-yield"
description = "Non-custodial sBTC yield optimizer on Stacks (mainnet)"
authors = []
telemetry = false
cache_dir = "./.cache"

# Mainnet bundle: 1 vault + 4 v4 adapters + 2 traits. mock-sbtc, vault v1..v4,
# rebalancer, yield-tracker, and all v1/v2/v3 adapters are intentionally absent.

[contracts.sip-010-trait]
path = "contracts/traits/sip-010-trait.clar"
clarity_version = 3
epoch = "latest"

[contracts.yield-source-v2]
path = "contracts/traits/yield-source-v2.clar"
clarity_version = 3
epoch = "latest"

[contracts.vault-v5]
path = "contracts/vault-v5.clar"
clarity_version = 3
epoch = "latest"

[contracts.bitflow-adapter-v4]
path = "contracts/adapters/bitflow-adapter-v4.clar"
clarity_version = 3
epoch = "latest"

[contracts.alex-adapter-v4]
path = "contracts/adapters/alex-adapter-v4.clar"
clarity_version = 3
epoch = "latest"

[contracts.zest-adapter-v4]
path = "contracts/adapters/zest-adapter-v4.clar"
clarity_version = 3
epoch = "latest"

[contracts.velar-adapter-v4]
path = "contracts/adapters/velar-adapter-v4.clar"
clarity_version = 3
epoch = "latest"

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = true, trusted_caller = true, callee_filter = false }
