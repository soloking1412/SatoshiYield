[project]
name = "satoshi-yield"
description = "Non-custodial sBTC yield optimizer on Stacks (mainnet)"
authors = []
telemetry = false
cache_dir = "./.cache"

# Mainnet bundle: 1 vault (vault-v6) + 2 live adapters (zest-earn, hermetica-hbtc)
# + traits. mock-sbtc / mock-zest-vault / mock-hbtc-vault are simnet/test ONLY.

# External dependency: real Zest Earn sBTC vault (used by zest-earn-adapter).
[[project.requirements]]
contract_id = "SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7.v0-vault-sbtc"

# External dependency: canonical sBTC token.
[[project.requirements]]
contract_id = "SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-token"

# External dependency: Hermetica hBTC vault (used by hermetica-hbtc-adapter).
# Clarity-3, single-deployer — resolves cleanly in Clarinet. For simnet tests the
# cached copy at this address is a self-contained shim (see tests/_shims); the
# real contract is validated via a mainnet fork before approval.
[[project.requirements]]
contract_id = "SP1S1HSFH0SQQGWKB69EYFNY0B1MHRMGXR3J1FH4D.vault-hbtc-v1-2"

[contracts.sip-010-trait]
path = "contracts/traits/sip-010-trait.clar"
clarity_version = 3
epoch = "latest"

# Sync yield-source trait (atomic deposit/withdraw) — Zest Earn.
[contracts.yield-source-v2]
path = "contracts/traits/yield-source-v2.clar"
clarity_version = 3
epoch = "latest"

# Async yield-source trait (deposit + two-phase request/claim/cancel) — hBTC.
[contracts.yield-source-async-v1]
path = "contracts/traits/yield-source-async-v1.clar"
clarity_version = 3
epoch = "latest"

# Test / devnet / simnet ONLY — gives the Vitest suite a SIP-010 token to
# deposit. NOT deployed to mainnet (binds to the real sbtc-token at runtime).
[contracts.mock-sbtc]
path = "contracts/token/mock-sbtc.clar"
clarity_version = 3
epoch = "latest"

# Real Zest Earn integration: trait the real vault must satisfy.
[contracts.zest-sbtc-vault-trait]
path = "contracts/traits/zest-sbtc-vault-trait.clar"
clarity_version = 3
epoch = "latest"

# Test / devnet / simnet ONLY — yielding stand-in for the real Zest Earn vault.
[contracts.mock-zest-vault]
path = "contracts/token/mock-zest-vault.clar"
clarity_version = 3
epoch = "latest"

[contracts.vault-v6]
path = "contracts/vault-v6.clar"
clarity_version = 3
epoch = "latest"

# Live adapter — routes sBTC into Zest Earn vault for real principal-protected yield.
[contracts.zest-earn-adapter]
path = "contracts/adapters/zest-earn-adapter.clar"
clarity_version = 3
epoch = "latest"

# Live adapter — routes sBTC into Hermetica hBTC vault (async two-phase withdrawal).
[contracts.hermetica-hbtc-adapter]
path = "contracts/adapters/hermetica-hbtc-adapter.clar"
clarity_version = 3
epoch = "latest"

[repl.settings]
initial_epoch = "3.2"

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = true, trusted_caller = true, callee_filter = false }
