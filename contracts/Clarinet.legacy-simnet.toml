epoch = "latest"

[contracts.zest-sbtc-vault-trait]
path = "contracts/traits/zest-sbtc-vault-trait.clar"
clarity_version = 3
epoch = "latest"

[contracts.mock-zest-vault]
path = "contracts/token/mock-zest-vault.clar"
