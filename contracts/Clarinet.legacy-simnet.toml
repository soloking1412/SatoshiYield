# UNIT TESTS ONLY. Both external dependencies resolve to tracked accounting shims.
# No canonical mainnet token dependency or real-protocol correctness claim.
[project]
name = "satoshi-yield-legacy-simnet"
description = "Non-custodial sBTC yield optimizer on Stacks (mainnet)"
authors = []
telemetry = false
cache_dir = "./.cache-legacy-simnet"


[[project.requirements]]
contract_id = "SP1A27KFY4XERQCCRCARCYD1CC5N7M6688BSYADJ7.v0-vault-sbtc"


[[project.requirements]]
